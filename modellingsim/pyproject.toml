[project]
name = "nemoray-modelling"
version = "0.1.0"
description = "NeMo-Ray modelling & simulation pipeline"
requires-python = ">=3.11"
dependencies = [
    "cuopt-server-cu13==26.4.0",
    "cuopt-sh-client==26.4.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemoray_modelling"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
